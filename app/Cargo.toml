[package]
name = "quest_hotpatch_app"
# Version required by cargo-apk
version = "0.1.0"
edition = "2024"
publish = false
description = "Bevy hot-patching on Android (subsecond) test app, aligned with bevy_oxr layout"

[lib]
name = "quest_hotpatch_app"
crate-type = ["rlib", "cdylib"]

[dependencies]
# NOTE: cargo-apk requires android-native-activity (NOT android-game-activity),
# same as bevy_oxr's android example.
# `hotpatching` auto-wires HotPatchPlugin into DefaultPlugins.
bevy = { version = "0.19", features = ["android-native-activity", "hotpatching"] }
quest-hotpatch = { path = "../crates/quest-hotpatch" }
dioxus-devtools = "0.7.10"
dioxus-cli-config = "0.7.10"

# --- cargo-apk metadata (aligned with bevy_oxr's examples/android/Cargo.toml) ---
[package.metadata.android]
package = "dev.malek.questhotpatch"
apk_name = "questhotpatch"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

# --- VR/Quest intent filters (commented out: this is currently a plain PHONE app).
#     Uncomment + add the OpenXR loader build.rs when porting to a Quest headset.
# [[package.metadata.android.uses_feature]]
# name = "android.hardware.vr.headtracking"
# required = true

# [[package.metadata.android.uses_feature]]
# name = "oculus.software.handtracking"
# required = true

# [[package.metadata.android.application.activity.intent_filter]]
# actions = ["android.intent.action.MAIN"]
# categories = [
#     "com.oculus.intent.category.VR",
#     "android.intent.category.LAUNCHER",
#     "org.khronos.openxr.intent.category.IMMERSIVE_HMD",
# ]


# --- Dev profile: dependencies optimized (release-grade), tip crate stays debug.
#     Keeps the running app fast while keeping subsecond active (debug_assertions)
#     and tip-crate recompiles quick.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
