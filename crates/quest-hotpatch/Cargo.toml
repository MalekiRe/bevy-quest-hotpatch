[package]
name = "quest-hotpatch"
version = "0.1.0"
edition = "2024"
publish = false
description = "Recreation of BevyFlock's with_hot_patch API: hot-patch Bevy systems (add/remove/change at runtime) via Dioxus subsecond, tuned for cargo-apk builds (Android/Quest)."

[lib]
name = "quest_hotpatch"

[dependencies]
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_derive = { version = "0.19", default-features = false }
bevy_log = { version = "0.19", default-features = false }
bevy_platform = { version = "0.19", default-features = false }
bevy_ecs_macros = { version = "0.19", default-features = false }
bevy_internal = { version = "0.19", features = ["track_location"] }
dioxus-devtools = "0.7.10"
quest-hotpatch-macros = { path = "../quest-hotpatch-macros", version = "0.1.0" }
crossbeam-channel = "0.5.15"
send_wrapper = "0.6.0"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
