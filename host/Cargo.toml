[package]
name = "quest-hotpatch-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "quest-hotpatch-host"
path = "src/main.rs"

[[bin]]
name = "rustc-shim"
path = "src/bin/rustc_shim.rs"

[[bin]]
name = "linker-shim"
path = "src/bin/linker_shim.rs"

[dependencies]
# host patch engine (thin build, symbol tables, jump tables, NDK linking)
whisker-dev-server = "=0.10.11"
# exact wire types used by the app's connect_subsecond() (dioxus protocol)
dioxus-devtools-types = "=0.7.10"
subsecond-types = "=0.7.10"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = "0.36"
notify = "8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
